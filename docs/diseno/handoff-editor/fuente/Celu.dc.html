<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:absolute;inset:0;pointer-events:none;font-family:-apple-system,'SF Pro',system-ui,sans-serif;color:{{ ink }}">
  <sc-if value="{{ phone }}" hint-placeholder-val="{{ true }}">
    <div style="position:absolute;top:11px;left:50%;transform:translateX(-50%);width:126px;height:37px;border-radius:24px;background:#000"></div>
  </sc-if>
  <div style="position:absolute;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;gap:{{ gap }};box-sizing:border-box;padding:{{ barPad }}">
    <div style="flex:{{ side }};height:22px;display:flex;align-items:center;justify-content:{{ timeAlign }};padding-top:1.5px">
      <span style="font-weight:590;font-size:{{ timeSize }};line-height:22px">9:41</span>
    </div>
    <div style="flex:{{ side }};height:22px;display:flex;align-items:center;justify-content:{{ iconsAlign }};gap:7px;padding-top:1px;padding-right:1px">
      <svg width="19" height="12" viewBox="0 0 19 12" fill="currentColor"><rect x="0" y="7.5" width="3.2" height="4.5" rx="0.7"></rect><rect x="4.8" y="5" width="3.2" height="7" rx="0.7"></rect><rect x="9.6" y="2.5" width="3.2" height="9.5" rx="0.7"></rect><rect x="14.4" y="0" width="3.2" height="12" rx="0.7"></rect></svg>
      <svg width="17" height="12" viewBox="0 0 17 12" fill="currentColor"><path d="M8.5 3.2C10.8 3.2 12.9 4.1 14.4 5.6L15.5 4.5C13.7 2.7 11.2 1.5 8.5 1.5C5.8 1.5 3.3 2.7 1.5 4.5L2.6 5.6C4.1 4.1 6.2 3.2 8.5 3.2Z"></path><path d="M8.5 6.8C9.9 6.8 11.1 7.3 12 8.2L13.1 7.1C11.8 5.9 10.2 5.1 8.5 5.1C6.8 5.1 5.2 5.9 3.9 7.1L5 8.2C5.9 7.3 7.1 6.8 8.5 6.8Z"></path><circle cx="8.5" cy="10.5" r="1.5"></circle></svg>
      <svg width="27" height="13" viewBox="0 0 27 13"><rect x="0.5" y="0.5" width="23" height="12" rx="3.5" stroke="currentColor" strokeOpacity="0.35" fill="none"></rect><rect x="2" y="2" width="20" height="9" rx="2" fill="currentColor"></rect><path d="M25 4.5V8.5C25.8 8.2 26.5 7.2 26.5 6.5C26.5 5.8 25.8 4.8 25 4.5Z" fill="currentColor" fillOpacity="0.4"></path></svg>
    </div>
  </div>
  <div style="position:absolute;bottom:0;left:0;right:0;height:34px;display:flex;justify-content:center;align-items:flex-end;padding-bottom:8px;box-sizing:border-box">
    <div style="width:{{ homeW }};height:5px;border-radius:100px;background:{{ home }}"></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844},&quot;oscuro&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;homeBlanco&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;tablet&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const dark = !!this.props.oscuro;
    const tablet = !!this.props.tablet;
    return {
      ink: dark ? '#FFFFFF' : '#000000',
      home: !this.props.homeOscuro && (dark || this.props.homeBlanco) ? 'rgba(255,255,255,.7)' : 'rgba(0,0,0,.25)',
      phone: !tablet,
      gap: tablet ? '0px' : '154px',
      barPad: tablet ? '10px 26px' : '21px 24px 19px',
      side: tablet ? '0 0 auto' : '1',
      timeAlign: tablet ? 'flex-start' : 'center',
      iconsAlign: tablet ? 'flex-end' : 'center',
      timeSize: tablet ? '15px' : '17px',
      homeW: tablet ? '315px' : '139px',
    };
  }
}
</script>
</body>
</html>
